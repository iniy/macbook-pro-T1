# MacBookPro13,2 guarded s2idle prerequisite; physical acceptance is separate.
# The historical trial filename is retained for existing installations.
# Preserve existing arguments and avoid duplicating an already selected value.
case " ${GRUB_CMDLINE_LINUX_DEFAULT:-} " in
    *" pcie_port_pm=off "*) ;;
    *) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:-} pcie_port_pm=off" ;;
esac
