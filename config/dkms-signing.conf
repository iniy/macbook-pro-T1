# DKMS 3.2 framework drop-in, scoped to this module. Avoid Ubuntu DKMS's
# implicit update-secureboot-policy --enroll-key when default keys are absent.
if [ "${module:-}" = macbook-t1-touchbar ]; then
    mok_signing_key=/var/lib/macbook-t1-signing/MOK.priv
    mok_certificate=/var/lib/macbook-t1-signing/MOK.der
elif [ "${mok_signing_key:-}" = /var/lib/macbook-t1-signing/MOK.priv ]; then
    # Avoid leaking our selection if DKMS reuses the shell for another module.
    mok_signing_key=""
    mok_certificate=""
fi
