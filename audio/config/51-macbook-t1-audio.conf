# CS8409/Apple 106b:3600 only. Keep all playback in the software mixer.
monitor.alsa.rules = [
  {
    # PCI identity is available before ACP opens the card; alsa.components is
    # populated later and can only be used for the node rule below.
    matches = [ {
      device.name = "~alsa_card.pci-.*"
      device.vendor.id = "0x8086"
      device.product.id = "0x9d70"
    } ]
    actions = { update-props = {
      api.alsa.soft-mixer = true
      api.alsa.use-ucm = false
      device.profile = "output:analog-stereo+input:analog-stereo"
      device.routes.default-sink-volume = 0.000008
      device.routes.default-source-volume = 1.0
    } }
  }
  {
    matches = [ {
      media.class = "~Audio/(Sink|Source)"
      alsa.components = "~HDA:10138409,106b3600,.*"
      alsa.name = "~CS8409.*Analog"
    } ]
    actions = { update-props = {
      api.alsa.soft-mixer = true
      audio.format = "S32LE"
      audio.rate = 44100
      audio.channels = 2
      audio.position = [ FL FR ]
      session.suspend-timeout-seconds = 0
    } }
  }
]
