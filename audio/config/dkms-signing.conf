# Scoped signing avoids Ubuntu DKMS's implicit EFI key-enrollment fallback.
if [ "${module:-}" = macbook-t1-audio ]; then
    mok_signing_key=/var/lib/macbook-t1-audio-signing/MOK.priv
    mok_certificate=/var/lib/macbook-t1-audio-signing/MOK.der
elif [ "${mok_signing_key:-}" = /var/lib/macbook-t1-audio-signing/MOK.priv ]; then
    mok_signing_key=""
    mok_certificate=""
fi
